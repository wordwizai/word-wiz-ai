<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wordwizIcon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance Optimization -->
    <meta name="theme-color" content="#10b981" />
    <link rel="preconnect" href="https://api.openai.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://cdn.vercel-insights.com" />

    <!--
      SEO NOTE — do not add page-specific tags to this file.

      index.html is served for every route, so any <title>, description,
      canonical, Open Graph or Twitter tag placed here appears on all 44 pages.
      A hardcoded canonical pointing at "/" is exactly what previously made
      every article, guide and comparison page look like a duplicate of the
      homepage to search engines.

      Per-page tags come from react-helmet-async, via SeoHead (static pages) or
      ArticlePageTemplate / ComparisonPageTemplate (content pages), and are
      baked into each route's static HTML by scripts/prerender.mjs.

      The <title> below is only a fallback for routes that render no Helmet
      block (the authenticated app surface, which is noindex anyway).
    -->
    <title>Word Wiz AI - Free AI Reading Tutor for Kids</title>
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="author" content="Word Wiz AI" />
  </head>
  <body>
    <div id="root">
      <!-- Fallback content for crawlers that don't execute JavaScript -->
      <noscript>
        <div
          style="
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            font-family: system-ui, -apple-system, sans-serif;
          "
        >
          <h1 style="font-size: 2em; margin-bottom: 0.5em">
            Word Wiz AI - Free AI Reading Tutor for Kids
          </h1>
          <p style="font-size: 1.1em; color: #666; margin-bottom: 2em">
            Help your child learn to read with AI-powered phoneme-level
            feedback. Free, forever.
          </p>
          <h2 style="font-size: 1.5em; margin-top: 1.5em">Features</h2>
          <ul style="line-height: 1.8; color: #333">
            <li>Real-time pronunciation feedback with speech recognition</li>
            <li>Phoneme-level analysis to identify specific sound errors</li>
            <li>AI-powered personalized reading practice</li>
            <li>Decodable stories and interactive exercises</li>
            <li>100% free - no subscriptions or credit card required</li>
          </ul>
          <p style="margin-top: 2em; font-size: 1.1em">
            <strong>Please enable JavaScript to use Word Wiz AI.</strong> This
            app requires JavaScript for interactive reading practice.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
